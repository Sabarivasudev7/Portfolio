spring.application.name=portfolio-backend

# ==========================================
# 1. Database Configuration
# Default: Local Oracle DB (overridden on Render via Environment Variables)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.username=${DB_USERNAME:c##portfolio}
spring.datasource.password=${DB_PASSWORD:port}

# ==========================================
# 2. JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true